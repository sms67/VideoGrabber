name: Build Windows EXE

# این workflow روی سرور ویندوزی گیت‌هاب، فایل VideoGrabber.exe را می‌سازد.
# اجرا: تب Actions → Build Windows EXE → Run workflow
# خروجی: در همان صفحه، بخش Artifacts → VideoGrabber-Windows

on:
  workflow_dispatch:      # اجرای دستی با دکمه
  push:
    tags: [ "v*" ]        # یا موقع ساخت تگ نسخه

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (takes a few minutes)
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name VideoGrabber --collect-all yt_dlp main.py

      - name: Download ffmpeg (for MP3 + best quality)
        shell: pwsh
        continue-on-error: true
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip' -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Copy-Item 'ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe' -Destination dist\
          Copy-Item 'ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe' -Destination dist\
          Remove-Item ffmpeg.zip -Force
          Remove-Item ffmpeg_tmp -Recurse -Force

      - name: Package ZIP
        shell: pwsh
        run: |
          Copy-Item README.md dist\
          $files = @('dist\VideoGrabber.exe', 'dist\README.md')
          if (Test-Path dist\ffmpeg.exe)  { $files += 'dist\ffmpeg.exe' }
          if (Test-Path dist\ffprobe.exe) { $files += 'dist\ffprobe.exe' }
          Compress-Archive -Path $files -DestinationPath VideoGrabber-Windows.zip

      - name: Upload artifact (your downloadable EXE)
        uses: actions/upload-artifact@v4
        with:
          name: VideoGrabber-Windows
          path: VideoGrabber-Windows.zip
          retention-days: 30
